name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: festival
          POSTGRES_PASSWORD: test
          POSTGRES_DB: festival
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festival -d festival"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrate test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://festival:test@127.0.0.1:5432/festival
          DIRECT_DATABASE_URL: postgresql://festival:test@127.0.0.1:5432/festival
          APP_MODE: development

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          APP_MODE: development
          DATABASE_URL: postgresql://festival:test@127.0.0.1:5432/festival
          SESSION_SECRET: ci-session-secret-at-least-32-chars
          CREDENTIAL_KEY: ci-credential-key-32chars-min!!
          CRON_SECRET: ci-cron-secret
          PAYMENT_PROVIDER: development
          OTP_PROVIDER: development
          ALLOW_PUBLIC_SALES: "false"
