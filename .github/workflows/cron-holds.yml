# Manual fallback for expiring ticket holds and running background jobs on production.
# The Worker's Cron Trigger (wrangler.jsonc, every 10 minutes) is the only scheduler:
# this duplicate every-2-minutes schedule helped keep the Neon compute awake 24/7 and
# exhaust the free-plan compute-hours quota. Trigger manually if the Worker cron is down.
# Requires repository secrets: CRON_SECRET, APP_URL (e.g. https://ganabhawan-festival.srksourabh.workers.dev)

name: Hold expiry cron

on:
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Run worker tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CRON_SECRET and APP_URL secrets are required."
            exit 1
          fi
          curl -fsS -X POST "${APP_URL%/}/api/cron/worker" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
